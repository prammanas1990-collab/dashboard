<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inventory Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --g:#76b900;--gd:#5a8d00;--ink:#000;--canvas:#fff;--soft:#f7f7f7;--hair:#ccc;--hair2:#5e5e5e;
  --body:#1a1a1a;--mute:#757575;--ash:#a7a7a7;--err:#e52020;--warn:#df6500;--ok:#3f8500;--blue:#0046a4;--r:2px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"NVIDIA-EMEA",Arial,"Noto Sans Thai",Helvetica,sans-serif;font-size:15px;line-height:1.5;color:var(--body);background:var(--canvas)}
a{color:var(--blue)}
.nav{background:#000;color:#fff;height:64px;display:flex;align-items:center;padding:0 32px;gap:32px;position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:12px;font-weight:700;font-size:18px;letter-spacing:.3px}
.brand i{width:14px;height:14px;background:var(--g);display:block}
.nav nav{display:flex;gap:4px;margin-left:16px;height:100%}
.nav nav a{color:#fff;text-decoration:none;font-weight:700;font-size:16px;padding:0 16px;display:flex;align-items:center;border-bottom:3px solid transparent}
.nav nav a:hover{color:var(--g)}
.nav nav a.on{border-bottom-color:var(--g)}
.nav .sp{flex:1}
.nav .meta{font-size:12px;color:rgba(255,255,255,.7)}
.bar{background:var(--soft);border-bottom:1px solid var(--hair);padding:12px 32px;display:flex;flex-wrap:wrap;gap:16px 24px;align-items:flex-end}
.bar .grp{display:flex;flex-direction:column;gap:4px}
.bar label,.lbl{font-size:12px;font-weight:700;text-transform:uppercase;color:var(--mute);letter-spacing:.2px}
input,select,button{font:inherit}
input[type=date],input[type=number],input[type=search],input[type=text],select{height:40px;padding:6px 12px;border:1px solid var(--hair);border-radius:var(--r);background:#fff;color:var(--ink)}
input:focus,select:focus{outline:2px solid var(--g);outline-offset:-1px}
input[type=number]{width:90px}
input[type=search]{min-width:240px}
.btn{height:40px;padding:0 18px;border-radius:var(--r);border:1px solid var(--ink);background:transparent;color:var(--ink);font-weight:700;cursor:pointer}
.btn:hover{background:#eee}
.btn.p{background:var(--g);border-color:var(--g);color:#000}
.btn.p:hover{background:var(--gd);border-color:var(--gd)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:40px;padding:0 14px;border:1px solid var(--hair);background:#fff;border-radius:var(--r);font-weight:700;font-size:14px;cursor:pointer}
.chip.on{background:#000;color:#fff;border-color:#000}
main{padding:24px 32px 64px;max-width:1500px;margin:0 auto}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-bottom:24px}
.tile{position:relative;border:1px solid var(--hair);border-radius:var(--r);padding:20px 20px 16px;background:#fff;text-align:left;cursor:default}
.tile.click{cursor:pointer}
.tile.click:hover{border-color:var(--ink)}
.tile::before,.card::before{content:"";position:absolute;top:-1px;left:-1px;width:12px;height:12px;background:var(--g)}
.tile .k{font-size:12px;font-weight:700;text-transform:uppercase;color:var(--mute)}
.tile .v{font-size:32px;font-weight:700;line-height:1.2;margin:4px 0}
.tile .s{font-size:13px;color:var(--mute)}
.tile.err .v{color:var(--err)} .tile.warn .v{color:var(--warn)} .tile.ok .v{color:var(--ok)}
.tile.sel{border:2px solid #000;padding:19px 19px 15px}
.tabs{display:flex;gap:8px;margin:8px 0 20px;flex-wrap:wrap;border-bottom:1px solid var(--hair);padding-bottom:16px}
.tab{padding:10px 20px;border:1px solid transparent;border-radius:var(--r);background:transparent;font-weight:700;cursor:pointer;font-size:15px}
.tab:hover{border-color:var(--hair)}
.tab.on{background:#000;color:#fff}
.tab .n{display:inline-block;min-width:22px;padding:0 6px;margin-left:8px;border-radius:var(--r);background:var(--g);color:#000;font-size:12px;text-align:center}
.ctl{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:flex-end;margin-bottom:20px}
.ctl .grp{display:flex;flex-direction:column;gap:4px}
.card{position:relative;border:1px solid var(--hair);border-radius:var(--r);padding:24px;background:#fff;margin-bottom:24px}
.card h3{margin:0 0 4px;font-size:18px}
.card .sub{font-size:13px;color:var(--mute);margin-bottom:16px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:24px}
.cols .card{margin-bottom:0}
.tw{overflow:auto;border:1px solid var(--hair);border-radius:var(--r);max-height:640px}
table{border-collapse:collapse;width:100%;font-size:14px}
th{position:sticky;top:0;background:#000;color:#fff;text-align:left;padding:10px 12px;font-size:12px;text-transform:uppercase;white-space:nowrap;cursor:pointer;user-select:none;letter-spacing:.2px}
th:hover{color:var(--g)}
td{padding:8px 12px;border-top:1px solid #e5e5e5;vertical-align:top}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr:hover td{background:#fafafa}
.sm{font-size:12px;color:var(--mute)}
.badge{display:inline-block;padding:1px 8px;border-radius:var(--r);font-size:12px;font-weight:700;background:var(--soft);border:1px solid var(--hair);white-space:nowrap}
.badge.ok{color:var(--ok);border-color:var(--ok)}
.badge.warn{color:var(--warn);border-color:var(--warn)}
.badge.err{color:#fff;background:var(--err);border-color:var(--err)}
.badge.dark{color:#fff;background:#000;border-color:#000}
.badge.g{background:var(--g);border-color:var(--g);color:#000}
.brow{display:grid;grid-template-columns:minmax(120px,38%) 1fr 90px;gap:10px;align-items:center;margin:6px 0;font-size:13px}
.bl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bt{height:14px;background:var(--soft);border:1px solid #eee}
.bf{height:100%;background:var(--g)}
.bv{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.note{border-left:4px solid var(--g);background:var(--soft);padding:10px 14px;font-size:13px;margin-bottom:16px}
.empty{padding:32px;text-align:center;color:var(--mute)}
.drop{border:2px dashed var(--hair2);border-radius:var(--r);padding:40px;text-align:center;background:var(--soft)}
.drop.over{border-color:var(--g);background:#f1f9e0}
.hide{display:none!important}
svg text{font-family:inherit;font-size:11px;fill:#757575}
@media(max-width:800px){.nav{padding:0 16px;gap:12px}.bar,main{padding-left:16px;padding-right:16px}.cols{grid-template-columns:1fr}input[type=search]{min-width:160px}.nav .meta{display:none}}
</style>
</head>
<body>
<header class="nav">
  <div class="brand"><i></i>PHARMACY INVENTORY</div>
  <nav>
    <a class="on" href="#">Inventory Dashboard</a>
    <a href="drug_dashboard.html" id="menuDrug">Drug Dashboard</a>
  </nav>
  <div class="sp"></div>
  <div class="meta" id="navMeta"></div>
</header>

<div class="bar" id="bar">
  <div class="grp"><label>ช่วงเวลา (จ่ายยา / อัตราใช้)</label>
    <div style="display:flex;gap:8px;align-items:center">
      <input type="date" id="from"><span>–</span><input type="date" id="to">
    </div></div>
  <div class="grp"><label>ช่วงด่วน</label>
    <div class="chips" id="presets">
      <button class="chip" data-p="7">7 วัน</button>
      <button class="chip" data-p="14">14 วัน</button>
      <button class="chip" data-p="30">30 วัน</button>
      <button class="chip on" data-p="all">ทั้งหมด</button>
    </div></div>
  <div class="grp"><label>วันอ้างอิงตรวจวันหมดอายุ</label>
    <div style="display:flex;gap:8px"><input type="date" id="ref"><button class="btn" id="refToday" title="ใช้วันที่วันนี้">วันนี้</button></div></div>
  <div class="sp" style="flex:1"></div>
  <button class="btn" id="reload">โหลดไฟล์ใหม่</button>
</div>

<main>
  <div id="loader" class="hide"></div>
  <div id="app" class="hide">
    <div class="tiles" id="insights"></div>
    <div class="tabs" id="tabs"></div>
    <div id="view"></div>
  </div>
</main>

<script>
/* ===================== ตั้งค่า ===================== */
const CONFIG = {
  files: { drugs: 'drugs_update.json', stock: 'stock.json', dispense: 'dispense-log.json' },
  menuLink: 'drug_dashboard.html'
};

/* ===================== state ===================== */
const S = {
  drugs: [], stock: [], log: [], stockMeta: {}, logMeta: {}, drugMeta: {},
  ref: '', from: '', to: '', dMin: '', dMax: '', tab: 'stock', sort: {},
  f: {
    stock: { q: '', cat: '', status: '', hideZero: true },
    exp: { bucket: 'risk', q: '' },
    ord: { lead: 7, cover: 30, q: '', all: false, onlyNeed: true },
    dsp: { q: '', rx: '', type: '', cat: '', metric: 'units', flagged: false }
  }
};
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nf = (n, d = 0) => (n == null || isNaN(n)) ? '–' : Number(n).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
const money = n => n == null ? '–' : '฿' + nf(n, n < 100 && n % 1 ? 2 : 0);
const fd = s => s ? s.slice(8, 10) + '/' + s.slice(5, 7) + '/' + s.slice(0, 4) : '–';
const isDate = s => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}/.test(s);
const U = s => { const [y, m, d] = s.slice(0, 10).split('-').map(Number); return Date.UTC(y, m - 1, d); };
const diffDays = (a, b) => Math.round((U(b) - U(a)) / 864e5);
const addDays = (s, n) => new Date(U(s) + n * 864e5).toISOString().slice(0, 10);
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };

/* ===================== โหลดไฟล์ ===================== */
async function tryFetch() {
  const out = {};
  for (const [k, url] of Object.entries(CONFIG.files)) {
    try {
      const r = await fetch(url, { cache: 'no-store' });
      if (!r.ok) throw new Error(r.status);
      out[k] = await r.json();
    } catch (e) { out[k] = null; }
  }
  return out;
}
function ingest(list) {
  const got = {};
  for (const { json } of list) {
    const it = json && json.items;
    if (!Array.isArray(it) || !it.length) continue;
    const f = it[0];
    if ('dispense_id' in f) got.dispense = json;
    else if ('stock_id' in f) got.stock = json;
    else if ('generic_name' in f) got.drugs = json;
  }
  return got;
}
function applyData(g) {
  S.drugs = g.drugs.items; S.drugMeta = g.drugs.meta || {};
  S.stock = g.stock.items; S.stockMeta = g.stock.meta || {};
  S.log = g.dispense.items; S.logMeta = g.dispense.meta || {};
  S.ref = S.ref || S.stockMeta.as_of || todayStr();
  const ds = S.log.map(x => (x.datetime || '').slice(0, 10)).filter(isDate).sort();
  S.dMin = ds[0] || S.ref; S.dMax = ds[ds.length - 1] || S.ref;
  S.from = S.dMin; S.to = S.dMax;
  prepare();
  $('#loader').classList.add('hide'); $('#app').classList.remove('hide');
  $('#from').value = S.from; $('#to').value = S.to; $('#ref').value = S.ref;
  $('#navMeta').textContent = `สต็อก ณ ${fd(S.stockMeta.as_of)} · ${S.drugs.length} รายการยา`;
  renderTabs(); renderTab();
}
function showLoader(msg, partial) {
  $('#app').classList.add('hide');
  const L = $('#loader'); L.classList.remove('hide');
  L.innerHTML = `<div class="card"><h3>โหลดไฟล์ JSON</h3>
    <div class="sub">${esc(msg)}</div>
    <div class="note">ไฟล์ไม่ได้ฝังอยู่ใน HTML — วางไฟล์ <b>${Object.values(CONFIG.files).join(', ')}</b> ไว้โฟลเดอร์เดียวกับหน้านี้แล้วเปิดผ่านเว็บเซิร์ฟเวอร์ (เช่น <code>python -m http.server</code>) หรือเลือกไฟล์ด้วยตนเองด้านล่าง (ระบบจะจำแนกไฟล์ให้อัตโนมัติ)</div>
    <div class="drop" id="drop"><p><b>ลากไฟล์ทั้ง 3 มาวางที่นี่</b> หรือ</p>
    <input type="file" id="pick" accept=".json,application/json" multiple>
    <p class="sm" id="pickMsg">${partial || ''}</p></div>
    <p><button class="btn p" id="retry">ลองโหลดจากโฟลเดอร์อีกครั้ง</button></p></div>`;
  const handle = async files => {
    const list = [];
    for (const f of files) { try { list.push({ name: f.name, json: JSON.parse(await f.text()) }); } catch (e) { } }
    const g = ingest(list), miss = ['drugs', 'stock', 'dispense'].filter(k => !g[k]);
    if (miss.length) { $('#pickMsg').textContent = 'ยังขาด: ' + miss.map(k => ({ drugs: 'ทะเบียนยา', stock: 'สต็อก', dispense: 'รายการจ่ายยา' }[k])).join(', '); return; }
    applyData(g);
  };
  $('#pick').onchange = e => handle([...e.target.files]);
  const d = $('#drop');
  d.ondragover = e => { e.preventDefault(); d.classList.add('over'); };
  d.ondragleave = () => d.classList.remove('over');
  d.ondrop = e => { e.preventDefault(); d.classList.remove('over'); handle([...e.dataTransfer.files]); };
  $('#retry').onclick = boot;
}
async function boot() {
  $('#loader').classList.remove('hide');
  $('#loader').innerHTML = '<div class="empty">กำลังโหลดข้อมูล…</div>';
  const r = await tryFetch();
  if (r.drugs && r.stock && r.dispense) return applyData(r);
  const miss = Object.entries(r).filter(([, v]) => !v).map(([k]) => CONFIG.files[k]);
  showLoader('โหลดอัตโนมัติไม่สำเร็จ: ' + miss.join(', '));
}

/* ===================== เตรียมข้อมูล ===================== */
let drugBy = new Map(), lotBy = new Map();
function prepare() {
  drugBy = new Map(S.drugs.map(d => [d.sku, d]));
  lotBy = new Map(S.stock.map(l => [l.sku + '|' + l.lot, l]));
  for (const l of S.stock) {
    l.unit_cost = Number(l.unit_cost) || 0;
    l.qty = Number(l.qty_on_hand) || 0;
    l.d = drugBy.get(l.sku) || null;
    l.name = l.d ? `${l.d.generic_name} ${l.d.strength}` : l.sku;
    l.cat = l.d ? l.d.category : '(ไม่อยู่ในทะเบียน)';
    l.value = l.qty * l.unit_cost;
  }
  for (const x of S.log) {
    x.date = (x.datetime || '').slice(0, 10); x.time = (x.datetime || '').slice(11, 16);
    x.d = drugBy.get(x.sku) || null;
    x.name = x.d ? `${x.d.generic_name} ${x.d.strength}` : x.sku;
    x.cat = x.d ? x.d.category : '(ไม่อยู่ในทะเบียน)';
    x.lotRec = lotBy.get(x.sku + '|' + x.lot) || null;
    x.type = x.type || 'dispense';
    x.flags = [];
    if (x.type === 'dispense') {
      if (!x.lotRec) x.flags.push(['err', 'ไม่พบล็อตในสต็อก']);
      else {
        if (isDate(x.lotRec.expiry) && x.date > x.lotRec.expiry) x.flags.push(['err', 'จ่ายจากล็อตหมดอายุ']);
        if (x.lotRec.status === 'quarantine') x.flags.push(['warn', 'ล็อตถูกกักกัน']);
      }
      if (!(x.qty > 0)) x.flags.push(['warn', 'qty ≤ 0']);
      else if (x.qty % 1) x.flags.push(['warn', 'qty ไม่เป็นจำนวนเต็ม']);
    }
    if (S.stockMeta.as_of && x.date > S.stockMeta.as_of) x.flags.push(['warn', 'เลยวันที่ของสต็อก']);
    if (!x.d) x.flags.push(['warn', 'ยาไม่อยู่ในทะเบียน']);
  }
  enrich();
}
function bucketOf(l) {
  if (l.qty <= 0) return 'zero';
  if (!isDate(l.expiry)) return 'none';
  const dl = l.days;
  return dl < 0 ? 'expired' : dl <= 30 ? 'd30' : dl <= 60 ? 'd60' : dl <= 90 ? 'd90' : 'ok';
}
function enrich() {
  for (const l of S.stock) {
    l.days = isDate(l.expiry) ? diffDays(S.ref, l.expiry) : null;
    l.bucket = bucketOf(l);
    l.sellable = l.status === 'active' && l.qty > 0 && l.days !== null && l.days >= 0;
  }
}
const inRange = x => x.date >= S.from && x.date <= S.to;
const logRange = () => S.log.filter(inRange);
function usageMap() {
  const m = new Map();
  for (const x of logRange()) if (x.type === 'dispense' && x.qty > 0) m.set(x.sku, (m.get(x.sku) || 0) + x.qty);
  return m;
}
const rangeDays = () => Math.max(1, diffDays(S.from, S.to) + 1);

/* ===================== ตัวช่วย UI ===================== */
function bars(rows, fmt = nf) {
  if (!rows.length) return '<div class="empty">ไม่มีข้อมูล</div>';
  const m = Math.max(...rows.map(r => r.v), 1e-9);
  return rows.map(r => `<div class="brow"><div class="bl" title="${esc(r.l)}">${esc(r.l)}</div><div class="bt"><div class="bf" style="width:${Math.max(0, r.v / m * 100)}%;${r.c ? 'background:' + r.c : ''}"></div></div><div class="bv">${fmt(r.v)}</div></div>`).join('');
}
function cmp(a, b) {
  if (a == null && b == null) return 0; if (a == null) return 1; if (b == null) return -1;
  return typeof a === 'number' && typeof b === 'number' ? a - b : String(a).localeCompare(String(b), 'th');
}
function table(id, cols, rows, limit = 300) {
  const s = S.sort[id];
  if (s) { const c = cols.find(c => c.k === s.k); if (c) rows = [...rows].sort((a, b) => cmp(c.v(a), c.v(b)) * s.d); }
  if (!rows.length) return '<div class="empty">ไม่พบรายการตามเงื่อนไข</div>';
  const head = cols.map(c => `<th class="${c.n ? 'num' : ''}" data-sort="${id}|${c.k}">${c.h}${s && s.k === c.k ? (s.d > 0 ? ' ▲' : ' ▼') : ''}</th>`).join('');
  const body = rows.slice(0, limit).map(r => `<tr>${cols.map(c => `<td class="${c.n ? 'num' : ''}">${c.r ? c.r(r) : esc(c.v(r) ?? '–')}</td>`).join('')}</tr>`).join('');
  return `<div class="tw"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>
  <div class="sm" style="margin-top:6px">แสดง ${nf(Math.min(rows.length, limit))} จาก ${nf(rows.length)} รายการ · คลิกหัวคอลัมน์เพื่อเรียง</div>`;
}
function dailyChart(rows, color = '#76b900', fmt = nf) {
  if (!rows.length) return '<div class="empty">ไม่มีข้อมูล</div>';
  const W = 900, H = 230, L = 44, B = 28, T = 10, n = rows.length;
  const mx = Math.max(...rows.map(r => r.v), 1);
  const step = Math.pow(10, Math.floor(Math.log10(mx))), nice = Math.ceil(mx / step) * step;
  const bw = (W - L - 8) / n, ph = H - B - T;
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="กราฟรายวัน">`;
  for (let i = 0; i <= 4; i++) {
    const y = T + ph - ph * i / 4;
    s += `<line x1="${L}" x2="${W - 8}" y1="${y}" y2="${y}" stroke="#e5e5e5"/><text x="${L - 6}" y="${y + 4}" text-anchor="end">${nf(nice * i / 4)}</text>`;
  }
  const every = Math.ceil(n / 12);
  rows.forEach((r, i) => {
    const h = ph * r.v / nice, x = L + i * bw + bw * .12, y = T + ph - h;
    s += `<rect x="${x}" y="${y}" width="${bw * .76}" height="${Math.max(h, r.v > 0 ? 1 : 0)}" fill="${r.warn ? '#e52020' : color}"><title>${fd(r.l)}: ${fmt(r.v)}</title></rect>`;
    if (i % every === 0) s += `<text x="${x + bw * .38}" y="${H - 10}" text-anchor="middle">${r.l.slice(8, 10)}/${r.l.slice(5, 7)}</text>`;
  });
  return s + '</svg>';
}
const statusBadge = s => ({ active: '<span class="badge ok">active</span>', quarantine: '<span class="badge warn">quarantine</span>', written_off: '<span class="badge dark">written off</span>' }[s] || `<span class="badge">${esc(s)}</span>`);
const optList = (arr, sel, all = 'ทั้งหมด') => `<option value="">${all}</option>` + arr.map(a => `<option ${a === sel ? 'selected' : ''}>${esc(a)}</option>`).join('');

/* ---------- Expiry ---------- */
const BK = [['expired', 'หมดอายุแล้ว', 'err'], ['d30', '≤ 30 วัน', 'warn'], ['d60', '31–60 วัน', 'warn'], ['d90', '61–90 วัน', ''], ['ok', '> 90 วัน', 'ok'], ['none', 'ไม่ระบุวันหมดอายุ', 'warn']];
function wasteMap() {
  const use = usageMap(), days = rangeDays(), w = new Map();
  const bySku = {};
  S.stock.filter(l => l.qty > 0 && l.days !== null && l.days >= 0 && l.status === 'active').forEach(l => (bySku[l.sku] = bySku[l.sku] || []).push(l));
  for (const [sku, ls] of Object.entries(bySku)) {
    const daily = (use.get(sku) || 0) / days; let used = 0;
    ls.sort((a, b) => a.days - b.days);
    for (const l of ls) { const can = Math.min(l.qty, Math.max(0, daily * l.days - used)); used += can; w.set(l.stock_id, l.qty - can); }
  }
  return w;
}
function viewExp() {

/* ---------- Reorder ---------- */
function reorderRows() {
  const f = S.f.ord, use = usageMap(), days = rangeDays();
  const skus = new Set(S.stock.map(l => l.sku)); use.forEach((_, k) => skus.add(k));
  if (f.all) S.drugs.forEach(d => skus.add(d.sku));
  const bySku = {}; S.stock.forEach(l => (bySku[l.sku] = bySku[l.sku] || []).push(l));
  const out = [];
  for (const sku of skus) {
    const d = drugBy.get(sku) || null, ls = bySku[sku] || [];
    const avail = ls.filter(l => l.sellable).reduce((a, l) => a + l.qty, 0);
    const held = ls.filter(l => l.qty > 0 && !l.sellable).reduce((a, l) => a + l.qty, 0);
    const horizon = f.lead + f.cover;
    const soonExp = ls.filter(l => l.sellable && l.days <= horizon).reduce((a, l) => a + l.qty, 0);
    const daily = (use.get(sku) || 0) / days, rl = d ? d.reorder_level : 0;
    const cover = daily > 0 ? avail / daily : null;
    const status = avail <= 0 ? 'out' : avail < rl ? 'low' : (cover !== null && cover < f.lead) ? 'soon' : 'ok';
    const target = Math.max(rl, Math.ceil(daily * horizon));
    const order = status === 'ok' ? 0 : Math.max(0, Math.ceil(target - avail));
    const costLots = ls.filter(l => l.qty > 0); let cost = null;
    if (costLots.length) cost = costLots.reduce((a, l) => a + l.unit_cost * l.qty, 0) / costLots.reduce((a, l) => a + l.qty, 0);
    else if (ls.length) cost = [...ls].sort((a, b) => (b.received_date || '').localeCompare(a.received_date || ''))[0].unit_cost;
    out.push({ sku, d, name: d ? `${d.generic_name} ${d.strength}` : sku, cat: d ? d.category : '(ไม่อยู่ในทะเบียน)', unit: d ? d.unit : '', avail, held, soonExp, daily, rl, cover, status, order, cost, inStock: ls.length > 0, used: use.get(sku) || 0 });
  }
  return out;
}
const ST = { out: ['err', 'หมดสต็อก'], low: ['warn', 'ต่ำกว่าจุดสั่ง'], soon: ['warn', 'ใกล้หมด'], ok: ['ok', 'เพียงพอ'] };
function ordFiltered() {
  const f = S.f.ord, q = f.q.trim().toLowerCase();
  return reorderRows().filter(r => (!q || (r.name + r.sku).toLowerCase().includes(q)) && (!f.onlyNeed || r.status !== 'ok'));
}
function viewOrd() {
  const f = S.f.ord, all = reorderRows().filter(r => f.all || r.inStock || r.used > 0);
  const need = all.filter(r => r.status !== 'ok');
  const rows = ordFiltered();
  const tile = (k, v, s, c = '') => `<div class="tile ${c}"><div class="k">${k}</div><div class="v">${v}</div><div class="s">${s}</div></div>`;
  return `<div class="tiles">
    ${tile('ต้องสั่งซื้อ', nf(need.length), `จาก ${nf(all.length)} รายการที่ติดตาม`, need.length ? 'warn' : 'ok')}
    ${tile('หมดสต็อก', nf(all.filter(r => r.status === 'out').length), 'พร้อมจ่าย = 0', 'err')}
    ${tile('ต่ำกว่าจุดสั่ง', nf(all.filter(r => r.status === 'low').length), 'ต่ำกว่า reorder level', 'warn')}
    ${tile('งบสั่งซื้อโดยประมาณ', money(need.reduce((a, r) => a + (r.cost || 0) * r.order, 0)), 'ใช้ต้นทุนถัวเฉลี่ยล็อตปัจจุบัน')}
  </div>
  <div class="note"><b>วิธีคิด:</b> พร้อมจ่าย = ล็อต active ที่ยังไม่หมดอายุ ณ ${fd(S.ref)} · อัตราใช้ต่อวัน = ยอดจ่ายในช่วง ${fd(S.from)} – ${fd(S.to)} ÷ ${rangeDays()} วัน · เป้าหมาย = max(reorder level, อัตราใช้ × (${f.lead}+${f.cover}) วัน) · แนะนำสั่ง = เป้าหมาย − พร้อมจ่าย · "ใกล้หมด" = พอใช้น้อยกว่าระยะเวลารอของ</div>

    { k: 'st', h: 'สถานะ', v: r => ['out', 'low', 'soon', 'ok'].indexOf(r.status), r: r => `<span class="badge ${ST[r.status][0]}">${ST[r.status][1]}</span>` },
    { k: 'av', h: 'พร้อมจ่าย', n: 1, v: r => r.avail, r: r => nf(r.avail) },
    { k: 'rl', h: 'จุดสั่งซื้อ', n: 1, v: r => r.rl, r: r => nf(r.rl) },
    { k: 'dy', h: 'ใช้/วัน', n: 1, v: r => r.daily, r: r => nf(r.daily, 1) },
    { k: 'cv', h: 'พอใช้ (วัน)', n: 1, v: r => r.cover, r: r => r.cover == null ? '–' : nf(r.cover, 0) },
    { k: 'se', h: `หมดอายุใน ${f.lead + f.cover} วัน`, n: 1, v: r => r.soonExp, r: r => r.soonExp ? `<span style="color:var(--warn)">${nf(r.soonExp)}</span>` : '–' },
    { k: 'hd', h: 'ติดกัก/หมดอายุ', n: 1, v: r => r.held, r: r => r.held ? nf(r.held) : '–' },
    { k: 'od', h: 'แนะนำสั่ง', n: 1, v: r => r.order, r: r => r.order ? `<b>${nf(r.order)}</b> <span class="sm">${esc(r.unit)}</span>` : '–' },
    { k: 'cs', h: 'ต้นทุน/หน่วย', n: 1, v: r => r.cost, r: r => r.cost == null ? '–' : nf(r.cost, 2) },
    { k: 'am', h: 'ประมาณการ', n: 1, v: r => (r.cost || 0) * r.order, r: r => r.order && r.cost != null ? nf(r.cost * r.order, 2) : '–' }
  ], rows)}</div>`;
}
function exportCsv() {
  const rows = ordFiltered().filter(r => r.order > 0);
  const h = ['sku', 'ยา', 'หมวด', 'พร้อมจ่าย', 'จุดสั่งซื้อ', 'ใช้ต่อวัน', 'แนะนำสั่ง', 'หน่วย', 'ต้นทุนต่อหน่วย', 'ประมาณการ'];
  const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const lines = [h.map(q).join(',')].concat(rows.map(r => [r.sku, r.name, r.cat, r.avail, r.rl, r.daily.toFixed(2), r.order, r.unit, r.cost == null ? '' : r.cost.toFixed(2), r.cost == null ? '' : (r.cost * r.order).toFixed(2)].map(q).join(',')));
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['﻿' + lines.join('\n')], { type: 'text/csv;charset=utf-8' }));
  a.download = `reorder_${S.ref}.csv`; a.click();
}

/* ---------- Dispense ---------- */
function viewDsp() {
  const f = S.f.dsp, q = f.q.trim().toLowerCase();
  const base = logRange();
  const rows = base.filter(x => (!q || (x.dispense_id + x.name + x.sku + x.patient_code + x.lot).toLowerCase().includes(q)) && (!f.rx || x.pharmacist_code === f.rx) && (!f.type || x.type === f.type) && (!f.cat || x.cat === f.cat) && (!f.flagged || x.flags.length));
  const dsp = rows.filter(x => x.type === 'dispense' && x.qty > 0);
  const units = dsp.reduce((a, x) => a + x.qty, 0);
  const pts = new Set(rows.map(x => x.patient_code)).size;
  const byDay = {}; dsp.forEach(x => byDay[x.date] = (byDay[x.date] || 0) + (f.metric === 'units' ? x.qty : 1));
  const days = []; if (S.from <= S.to) for (let d = S.from; d <= S.to; d = addDays(d, 1)) days.push({ l: d, v: byDay[d] || 0, warn: S.stockMeta.as_of && d > S.stockMeta.as_of });
  const grp = (key, val) => { const m = {}; dsp.forEach(x => { const k = key(x); m[k] = (m[k] || 0) + val(x); }); return Object.entries(m).map(([l, v]) => ({ l, v })).sort((a, b) => b.v - a.v); };
  const topDrug = grp(x => x.name, x => x.qty).slice(0, 10);
  const byCat = grp(x => x.cat, x => x.qty);
  const byRx = grp(x => x.pharmacist_code, x => 1);
  const tile = (k, v, s, c = '') => `<div class="tile ${c}"><div class="k">${k}</div><div class="v">${v}</div><div class="s">${s}</div></div>`;
  const nflag = rows.filter(x => x.flags.length).length;
  return `<div class="tiles">
    ${tile('รายการจ่าย', nf(dsp.length), `${nf(rows.length - dsp.length)} รายการอื่น (void ฯลฯ)`)}
    ${tile('จำนวนที่จ่ายรวม', nf(units), 'หน่วยตามบรรจุภัณฑ์ของแต่ละยา')}
    ${tile('ผู้ป่วย (รหัสแฝง)', nf(pts), `เฉลี่ย ${nf(pts ? dsp.length / pts : 0, 1)} รายการ/คน`)}
    ${tile('รายการผิดปกติ', nf(nflag), 'ดูคอลัมน์ "ข้อสังเกต"', nflag ? 'warn' : 'ok')}
  </div>
  <div class="card"><div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px"><div><h3>จ่ายยารายวัน</h3><div class="sub">${fd(S.from)} – ${fd(S.to)} · แท่งสีแดง = วันที่เลยวันที่ของสต็อก</div></div>
    <div class="chips"><button class="chip ${f.metric === 'units' ? 'on' : ''}" data-m="units">หน่วย</button><button class="chip ${f.metric === 'tx' ? 'on' : ''}" data-m="tx">จำนวนรายการ</button></div></div>
    ${dailyChart(days)}</div>
  <div class="cols">
    <div class="card"><h3>10 อันดับยาที่จ่ายมากสุด</h3><div class="sub">ตามจำนวนหน่วย</div>${bars(topDrug)}</div>
    <div class="card"><h3>จ่ายตามหมวด</h3><div class="sub">ตามจำนวนหน่วย</div>${bars(byCat)}
      <h3 style="margin-top:20px">ตามเภสัชกร</h3><div class="sub">จำนวนรายการ</div>${bars(byRx)}</div>
  </div><div style="height:24px"></div>
  <div class="card"><h3>รายการจ่ายยา</h3><div class="sub">${nf(rows.length)} รายการตามตัวกรอง</div>
  ${table('dsp', [
    { k: 'id', h: 'รหัส', v: x => x.dispense_id },
    { k: 'dt', h: 'วันเวลา', v: x => x.datetime, r: x => `${fd(x.date)} <span class="sm">${esc(x.time)}</span>` },
    { k: 'name', h: 'ยา', v: x => x.name, r: x => `<b>${esc(x.name)}</b><div class="sm">${esc(x.sku)} · ล็อต ${esc(x.lot)}</div>` },
    { k: 'qty', h: 'จำนวน', n: 1, v: x => x.qty, r: x => nf(x.qty, x.qty % 1 ? 1 : 0) },
    { k: 'pt', h: 'ผู้ป่วย', v: x => x.patient_code },
    { k: 'rx', h: 'เภสัชกร', v: x => x.pharmacist_code },
    { k: 'ty', h: 'ประเภท', v: x => x.type, r: x => x.type === 'dispense' ? 'จ่าย' : `<span class="badge dark">${esc(x.type)}</span>` },
    { k: 'fl', h: 'ข้อสังเกต', v: x => x.flags.length, r: x => x.flags.map(([c, t]) => `<span class="badge ${c}">${esc(t)}</span>`).join(' ') + (x.incident_ref ? ` <span class="badge dark">${esc(x.incident_ref)}</span>` : '') }
  ], rows)}</div>`;
}

/* ===================== events ===================== */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab]'); if (t && S.app !== false) { S.tab = t.dataset.tab; renderTabs(); renderTab(); window.scrollTo({ top: 0 }); return; }
  const th = e.target.closest('th[data-sort]');
  if (th) { const [id, k] = th.dataset.sort.split('|'), s = S.sort[id]; S.sort[id] = s && s.k === k ? { k, d: -s.d } : { k, d: 1 }; update(); return; }
  const bk = e.target.closest('[data-bk]'); if (bk) { S.f.exp.bucket = bk.dataset.bk; update(); return; }
  const m = e.target.closest('[data-m]'); if (m) { S.f.dsp.metric = m.dataset.m; update(); return; }
  if (e.target.id === 'csv') exportCsv();
});
document.addEventListener('input', e => {
  const b = e.target.dataset && e.target.dataset.b; if (!b) return;
  const [tab, key] = b.split('.'), cur = S.f[tab][key];
  S.f[tab][key] = typeof cur === 'boolean' ? e.target.checked : typeof cur === 'number' ? (Number(e.target.value) || 0) : e.target.value;
  update();
});
function setRange(from, to, preset) {
  S.from = from; S.to = to; $('#from').value = from; $('#to').value = to;
  document.querySelectorAll('#presets .chip').forEach(c => c.classList.toggle('on', c.dataset.p === preset));
  update();
}
$('#presets').addEventListener('click', e => {
  const c = e.target.closest('.chip'); if (!c || !S.dMax) return;
  const p = c.dataset.p;
  setRange(p === 'all' ? S.dMin : (addDays(S.dMax, -(+p - 1)) < S.dMin ? S.dMin : addDays(S.dMax, -(+p - 1))), S.dMax, p);
});
$('#from').addEventListener('change', e => { if (e.target.value) setRange(e.target.value, S.to < e.target.value ? e.target.value : S.to, ''); });
$('#to').addEventListener('change', e => { if (e.target.value) setRange(S.from > e.target.value ? e.target.value : S.from, e.target.value, ''); });
$('#ref').addEventListener('change', e => { if (e.target.value) { S.ref = e.target.value; enrich(); update(); } });
$('#refToday').addEventListener('click', () => { S.ref = todayStr(); $('#ref').value = S.ref; enrich(); update(); });
$('#reload').addEventListener('click', () => showLoader('เลือกไฟล์ JSON ใหม่ หรือกดโหลดจากโฟลเดอร์อีกครั้ง'));
$('#menuDrug').setAttribute('href', CONFIG.menuLink);
boot();
</script>
</body>
</html>
